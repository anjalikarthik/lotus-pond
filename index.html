<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lotus Pond</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1a20">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#e8efe9;--dry:#51656d;--wet:#8be8d4;--tile:rgba(255,255,255,.05);--pink:#f2b8c6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 28%,#21414a,#0d1a20 72%) fixed;color:var(--ink);font-family:"Shippori Mincho",Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}
h1{margin:0;font-weight:500;font-size:28px;letter-spacing:.03em}
#sub{margin:0;font-size:16px;opacity:.75;min-height:1.4em;text-align:center;padding:0 20px}
#board{display:grid;width:min(90vw,58vh,520px);aspect-ratio:1}
.tile{all:unset;cursor:pointer;display:block;-webkit-tap-highlight-color:transparent}
.tile:focus-visible{outline:2px solid var(--wet);outline-offset:-4px;border-radius:16px}
.tile svg{width:100%;height:100%;display:block;overflow:visible;transition:transform .35s cubic-bezier(.3,1.3,.5,1),filter .8s calc(var(--d,0)*80ms)}
.bg{fill:var(--tile);stroke:rgba(255,255,255,.07)}
.ch path{stroke:var(--dry);transition:stroke .6s calc(var(--d,0)*80ms)}
.node{fill:var(--dry);transition:fill .6s calc(var(--d,0)*80ms)}
.wet .ch path{stroke:var(--wet)}
.wet .node{fill:var(--wet)}
.wet svg{filter:drop-shadow(0 0 7px rgba(139,232,212,.55))}
.spring{fill:var(--wet);filter:drop-shadow(0 0 8px var(--wet))}
.lotus{transform-origin:50px 50px;transform:scale(.45);transition:transform .9s calc(var(--d,0)*80ms + .25s) cubic-bezier(.2,1.2,.4,1)}
.lotus ellipse{fill:#6d7f86;transition:fill .8s calc(var(--d,0)*80ms + .25s)}
.heart{fill:#f6dc93;opacity:0;transition:opacity .6s calc(var(--d,0)*80ms + .6s)}
.wet .lotus{transform:scale(1)}
.wet .lotus ellipse{fill:var(--pink)}
.wet .heart{opacity:1}
#msg{min-height:46px;display:flex;align-items:center;gap:14px;font-size:18px;opacity:0;pointer-events:none;transition:opacity 1.2s .8s}
#msg.show{opacity:1;pointer-events:auto}
button.btn{font:inherit;font-size:15px;color:var(--ink);background:rgba(255,255,255,.1);border:0;padding:10px 18px;border-radius:999px;cursor:pointer}
button.btn:focus-visible{outline:2px solid var(--wet);outline-offset:2px}
button.btn[aria-pressed=true]{background:rgba(255,255,255,.18)}
#bar{display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(10,20,24,.5)}
#bar .btn{background:none}
#bar .btn[aria-pressed=true]{background:rgba(255,255,255,.15)}
#diff{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(10,20,24,.5)}
#diff .btn{background:none;padding:8px 16px}
#diff .btn[aria-pressed=true]{background:rgba(255,255,255,.16)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body>
<h1 id="title">Pond 1</h1>
<div id="diff" role="group" aria-label="Difficulty"><button class="btn" data-d="easy">Easy</button><button class="btn" data-d="medium">Medium</button><button class="btn" data-d="hard">Hard</button></div>
<p id="sub"></p>
<div id="board"></div>
<div id="msg"><span>Every lotus is open.</span><button class="btn" id="next">Next pond</button></div>
<div id="bar">
  <button class="btn" id="bSound" aria-pressed="true">Sound</button>
  <button class="btn" id="bNew">New layout</button>
</div>
<script>
const DIRS=[[-1,0],[0,1],[1,0],[0,-1]],SCALE=[261.6,293.7,329.6,392,440,523.3,587.3,659.3];
const ARMS=['M50 50V0','M50 50H100','M50 50V100','M50 50H0'];
const $=id=>document.getElementById(id);
let level=1,n=3,T=[],src=0,locked=false,sound=true,ctx=null,diff='easy';
const RANGE={easy:[3,4],medium:[4,6],hard:[5,8]};
const lk=()=>'lotus-level-'+diff;
try{diff=localStorage.getItem('lotus-diff')||'easy';if(!RANGE[diff])diff='easy'}catch(e){}
function loadLevel(){level=1;try{level=Math.max(1,+localStorage.getItem(lk())||1)}catch(e){}}
function setDiff(){document.querySelectorAll('#diff .btn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===diff))}

const rot=(m,k)=>{for(let i=0;i<k%4;i++)m=((m<<1)|(m>>3))&15;return m};
const eff=i=>rot(T[i].m,T[i].r);

function gen(){
  const m=Array(n*n).fill(0),seen=Array(n*n).fill(false),s=(Math.random()*n*n)|0,act=[s];
  seen[s]=true;
  while(act.length){
    const ai=Math.random()<.5?act.length-1:(Math.random()*act.length)|0,c=act[ai];
    const r=(c/n)|0,q=c%n;
    const opts=DIRS.map((d,i)=>[r+d[0],q+d[1],i]).filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n&&!seen[a*n+b]);
    if(!opts.length){act.splice(ai,1);continue}
    const [a,b,i]=opts[(Math.random()*opts.length)|0],k=a*n+b;
    seen[k]=true;m[c]|=1<<i;m[k]|=1<<((i+2)%4);act.push(k);
  }
  return {m,s};
}

function flow(){
  const d=Array(n*n).fill(-1);d[src]=0;const qu=[src];
  while(qu.length){
    const c=qu.shift(),r=(c/n)|0,q=c%n,e=eff(c);
    DIRS.forEach((dd,i)=>{
      const a=r+dd[0],b=q+dd[1];
      if(!(e>>i&1)||a<0||b<0||a>=n||b>=n)return;
      const k=a*n+b;
      if(d[k]<0&&(eff(k)>>((i+2)%4)&1)){d[k]=d[c]+1;qu.push(k)}
    });
  }
  return d;
}

function update(){
  const d=flow(),kids=$('board').children;
  d.forEach((v,i)=>{kids[i].classList.toggle('wet',v>=0);kids[i].style.setProperty('--d',v>0?v:0)});
  const wet=d.filter(v=>v>=0).length;
  return {wet,done:wet===n*n};
}

function build(){
  const [lo,hi]=RANGE[diff];n=Math.min(lo+Math.floor((level-1)/2),hi);locked=false;
  $('msg').classList.remove('show');
  do{
    const g=gen();T=g.m.map(m=>({m,r:(Math.random()*4)|0}));src=g.s;
  }while(flow().every(v=>v>=0));
  $('title').textContent='Pond '+level;
  $('sub').textContent=level<3?'Turn the stones so the water reaches every lotus.':'Take your time.';
  const b=$('board');b.style.gridTemplateColumns='repeat('+n+',1fr)';b.innerHTML='';
  T.forEach((t,i)=>{
    const bits=[0,1,2,3].filter(k=>t.m>>k&1),leaf=bits.length===1&&i!==src;
    let deco='';
    if(i===src)deco='<circle class="spring" cx="50" cy="50" r="19"/><circle cx="50" cy="50" r="28" fill="none" stroke="#8be8d4" stroke-opacity=".35" stroke-width="2"/>';
    else if(leaf)deco='<g class="lotus">'+[0,1,2,3,4,5,6,7].map(k=>'<ellipse cx="50" cy="33" rx="6.5" ry="14" transform="rotate('+k*45+' 50 50)"/>').join('')+'<circle class="heart" cx="50" cy="50" r="6"/></g>';
    else deco='<circle class="node" cx="50" cy="50" r="11"/>';
    const el=document.createElement('button');
    el.className='tile';el.setAttribute('aria-label','Stone '+(i+1)+', tap to turn');
    el.innerHTML='<svg viewBox="0 0 100 100"><rect class="bg" x="3" y="3" width="94" height="94" rx="14"/><g class="ch" fill="none" stroke-width="14">'+bits.map(k=>'<path d="'+ARMS[k]+'"/>').join('')+'</g>'+deco+'</svg>';
    el.firstChild.style.transform='rotate('+t.r*90+'deg)';
    el.onclick=()=>turn(i);
    b.appendChild(el);
  });
  update();
}

function turn(i){
  if(locked)return;
  T[i].r++;
  $('board').children[i].firstChild.style.transform='rotate('+T[i].r*90+'deg)';
  const s=update();
  tone(SCALE[s.wet%SCALE.length]);
  if(s.done)win();
}

function win(){
  locked=true;$('msg').classList.add('show');
  [0,2,4,5,7].forEach((k,j)=>tone(SCALE[k]*(k>4?1:1),.5+j*.22,.05,2.6));
}

function tone(f,t0=0,g0=.07,dur=1.6){
  if(!sound)return;
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended')ctx.resume();
  const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+t0;
  o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(g0,t+.03);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+dur+.05);
}

$('next').onclick=()=>{
  level++;try{localStorage.setItem(lk(),level)}catch(e){}
  build();
};
$('bNew').onclick=build;
$('bSound').onclick=()=>{sound=!sound;$('bSound').setAttribute('aria-pressed',sound)};
document.querySelectorAll('#diff .btn').forEach(b=>{b.onclick=()=>{diff=b.dataset.d;try{localStorage.setItem('lotus-diff',diff)}catch(e){}setDiff();loadLevel();build()}});
setDiff();loadLevel();
build();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){})</script>
</body>
</html>
