<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lotus Pond</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1a20">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#e8efe9;--bg1:#21414a;--bg2:#0d1a20;--dry:#51656d;--wet:#8be8d4;--glow:rgba(139,232,212,.55);--tile:rgba(255,255,255,.05);--pink:#f2b8c6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 28%,var(--bg1),var(--bg2) 72%) fixed;color:var(--ink);font-family:"Shippori Mincho",Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
h1{margin:0;font-weight:500;font-size:28px;letter-spacing:.03em}
#sub{margin:0;font-size:15px;opacity:.78;min-height:1.4em;text-align:center;padding:0 20px}
#board{display:grid;width:min(90vw,56vh,520px);aspect-ratio:1}
.tile{all:unset;cursor:pointer;display:block;-webkit-tap-highlight-color:transparent}
.tile:focus-visible{outline:2px solid var(--wet);outline-offset:-4px;border-radius:16px}
.tile svg{width:100%;height:100%;display:block;overflow:visible;transition:transform .35s cubic-bezier(.3,1.3,.5,1),filter .8s calc(var(--d,0)*80ms)}
.bg{fill:var(--tile);stroke:rgba(255,255,255,.07)}
.ch path{stroke:var(--dry);transition:stroke .6s calc(var(--d,0)*80ms)}
.node{fill:var(--dry);transition:fill .6s calc(var(--d,0)*80ms)}
.wet .ch path{stroke:var(--wet)}
.wet .node{fill:var(--wet)}
.wet svg{filter:drop-shadow(0 0 7px var(--glow))}
.spring{fill:var(--wet);filter:drop-shadow(0 0 8px var(--wet))}
.ring{fill:none;stroke:var(--wet);stroke-opacity:.35;stroke-width:2}
.lotus{transform-origin:50px 50px;transform:scale(.45);transition:transform .9s calc(var(--d,0)*80ms + .25s) cubic-bezier(.2,1.2,.4,1)}
.lotus ellipse{fill:#6d7f86;transition:fill .8s calc(var(--d,0)*80ms + .25s)}
.heart{fill:#f6dc93;opacity:0;transition:opacity .6s calc(var(--d,0)*80ms + .6s)}
.wet .lotus{transform:scale(1)}
.wet .lotus ellipse{fill:var(--pink)}
.wet .heart{opacity:1}
#msg{min-height:44px;display:flex;align-items:center;gap:14px;font-size:18px;opacity:0;pointer-events:none;transition:opacity 1.2s .8s}
#msg.show{opacity:1;pointer-events:auto}
button.btn{font:inherit;font-size:15px;color:var(--ink);background:rgba(255,255,255,.1);border:0;padding:10px 18px;border-radius:999px;cursor:pointer}
button.btn:focus-visible{outline:2px solid var(--wet);outline-offset:2px}
button.btn[aria-pressed=true]{background:rgba(255,255,255,.18)}
#bar,#diff{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(10,20,24,.5)}
#bar .btn,#diff .btn{background:none;padding:9px 12px;font-size:14px}
#bar .btn[aria-pressed=true],#diff .btn[aria-pressed=true]{background:rgba(255,255,255,.16)}
#lv{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,10,14,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:10}
#lv.open{display:flex}
#lvp{width:min(92vw,420px);max-height:84vh;overflow:auto;padding:20px;border-radius:22px;background:rgba(18,30,36,.95)}
#lvp h2{margin:0 0 14px;font-weight:500;font-size:20px;text-align:center}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.lvb{all:unset;box-sizing:border-box;aspect-ratio:1;border-radius:14px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.lvb[disabled]{opacity:.28;cursor:default}
.lvb.cur{outline:2px solid #fff;outline-offset:2px}
.lvb.done::after{content:"";position:absolute;right:6px;top:6px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.lvb:focus-visible{outline:2px solid #fff;outline-offset:2px}
#lvc{display:block;margin:0 auto}
#turns{font-size:16px;letter-spacing:.03em;min-height:1.3em;opacity:.92;transition:color .4s}
#turns.low{color:var(--pink)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body>
<h1 id="title">Level 1</h1>
<div id="diff" role="group" aria-label="Difficulty"><button class="btn" data-d="easy">Easy</button><button class="btn" data-d="medium">Medium</button><button class="btn" data-d="hard">Hard</button><button class="btn" data-d="ultimate">Ultimate</button></div>
<p id="sub"></p>
<div id="turns" aria-live="polite"></div>
<div id="board"></div>
<div id="msg"><span id="msgt">Every lotus is open.</span><button class="btn" id="next">Next level</button></div>
<div id="bar">
  <button class="btn" id="bSound" aria-pressed="true">Sound</button>
  <button class="btn" id="bLevels">Levels</button>
  <button class="btn" id="bNew">Restart</button>
  <button class="btn" id="bExit">Exit</button>
</div>
<div id="lv" role="dialog" aria-modal="true" aria-labelledby="lvh"><div id="lvp"><h2 id="lvh">Levels</h2><div id="grid"></div><button class="btn" id="lvc">Close</button></div></div>
<script>
const DIRS=[[-1,0],[0,1],[1,0],[0,-1]],SCALE=[261.6,293.7,329.6,392,440,523.3,587.3,659.3];
const ARMS=['M50 50V0','M50 50H100','M50 50V100','M50 50H0'];
const TOTAL=30;
const RANGE={easy:[3,5],medium:[4,6],hard:[5,8],ultimate:[7,9]};
const BRANCH={easy:.15,medium:.45,hard:.7,ultimate:.92};
const SHAPES={easy:['square'],medium:['square','octagon','triangle','plus'],hard:['octagon','triangle','plus','diamond','ring','hourglass'],ultimate:['octagon','plus','diamond','ring','hourglass','triangle']};
const NAMES={square:'Square',octagon:'Octagon',plus:'Cross',triangle:'Triangle',diamond:'Diamond',ring:'Ring',hourglass:'Hourglass'};
const MIN={square:3,octagon:4,triangle:4,plus:5,diamond:5,ring:5,hourglass:5};
const SLACK={medium:[1.6,3],hard:[1.35,2],ultimate:[1.2,2]};
const THEMES=[
 {name:'Moonlit Teal',bg1:'#21414a',bg2:'#0d1a20',wet:'#8be8d4',dry:'#51656d',pink:'#f2b8c6'},
 {name:'Rose Dusk',bg1:'#4a2a3a',bg2:'#1a0e18',wet:'#ffb3c1',dry:'#6d5560',pink:'#ffe0b8'},
 {name:'Lavender Night',bg1:'#34305a',bg2:'#120f24',wet:'#c4b5ff',dry:'#5d5a78',pink:'#f7c6ee'},
 {name:'Forest Mist',bg1:'#1f4a3a',bg2:'#0b1a14',wet:'#a8f0a0',dry:'#536b5d',pink:'#f6e7a1'},
 {name:'Ocean Deep',bg1:'#1d3d6b',bg2:'#08111f',wet:'#7fd0ff',dry:'#4f6580',pink:'#ffd0e0'},
 {name:'Amber Sunset',bg1:'#5a3a1e',bg2:'#1f130a',wet:'#ffd27f',dry:'#77634c',pink:'#ffb59a'},
 {name:'Sand Dune',bg1:'#4d4531',bg2:'#1a1710',wet:'#f2e2a0',dry:'#6c6650',pink:'#e8a0a0'},
 {name:'Aurora',bg1:'#2a1f4d',bg2:'#0b1620',wet:'#6ff5c1',dry:'#58607a',pink:'#ff9ed1'}];
const theme=l=>THEMES[(l-1)%THEMES.length];
const $=id=>document.getElementById(id);
let level=1,maxL=1,n=3,T=[],src=0,locked=false,sound=true,ctx=null,diff='easy',rnd=Math.random,left=0,limited=false,state='';
const lk=()=>'lotus-level-'+diff;

try{diff=localStorage.getItem('lotus-diff')||'easy';if(!RANGE[diff])diff='easy'}catch(e){}
function loadLevel(){
  maxL=1;try{maxL=Math.max(1,+localStorage.getItem(lk())||1)}catch(e){}
  level=Math.min(maxL,TOTAL);
}
function saveMax(){try{localStorage.setItem(lk(),maxL)}catch(e){}}
function setDiff(){document.querySelectorAll('#diff .btn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===diff))}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedOf(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

function applyTheme(t){
  const r=document.documentElement.style,h=t.wet.slice(1);
  r.setProperty('--bg1',t.bg1);r.setProperty('--bg2',t.bg2);r.setProperty('--dry',t.dry);
  r.setProperty('--wet',t.wet);r.setProperty('--pink',t.pink);
  r.setProperty('--glow','rgba('+parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16)+',.55)');
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t.bg2;
}

const rot=(m,k)=>{for(let i=0;i<k%4;i++)m=((m<<1)|(m>>3))&15;return m};
const eff=i=>rot(T[i].m,T[i].r);

function inShape(sh,r,c){
  const mid=(n-1)/2;
  if(sh==='octagon'){const k=Math.floor(n/3);return !(r+c<k||r+(n-1-c)<k||(n-1-r)+c<k||(n-1-r)+(n-1-c)<k)}
  if(sh==='triangle')return c<=r;
  if(sh==='plus'){let t=Math.max(1,Math.round(n/3));if((n-t)%2)t++;const lo=(n-t)/2,hi=lo+t-1;return (r>=lo&&r<=hi)||(c>=lo&&c<=hi)}
  if(sh==='diamond')return Math.abs(r-mid)+Math.abs(c-mid)<=mid+.5;
  if(sh==='ring'){const k=Math.max(1,Math.floor(n/3));return !(r>=k&&r<n-k&&c>=k&&c<n-k)}
  if(sh==='hourglass')return Math.abs(c-mid)<=Math.abs(r-mid);
  return true;
}

function gen(sh){
  const ok=Array.from({length:n*n},(_,i)=>inShape(sh,(i/n)|0,i%n));
  const cells=ok.map((v,i)=>v?i:-1).filter(i=>i>=0);
  const m=Array(n*n).fill(0),seen=Array(n*n).fill(false),s=cells[(rnd()*cells.length)|0],act=[s],pr=BRANCH[diff];
  seen[s]=true;
  while(act.length){
    const ai=rnd()<pr?(rnd()*act.length)|0:act.length-1,c=act[ai];
    const r=(c/n)|0,q=c%n;
    const opts=DIRS.map((d,i)=>[r+d[0],q+d[1],i]).filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n&&ok[a*n+b]&&!seen[a*n+b]);
    if(!opts.length){act.splice(ai,1);continue}
    const [a,b,i]=opts[(rnd()*opts.length)|0],k=a*n+b;
    seen[k]=true;m[c]|=1<<i;m[k]|=1<<((i+2)%4);act.push(k);
  }
  return {m,s,seen};
}

function flow(){
  const d=Array(n*n).fill(-1);d[src]=0;const qu=[src];
  while(qu.length){
    const c=qu.shift(),r=(c/n)|0,q=c%n,e=eff(c);
    DIRS.forEach((dd,i)=>{
      const a=r+dd[0],b=q+dd[1];
      if(!(e>>i&1)||a<0||b<0||a>=n||b>=n)return;
      const k=a*n+b;
      if(d[k]<0&&(eff(k)>>((i+2)%4)&1)){d[k]=d[c]+1;qu.push(k)}
    });
  }
  return d;
}

function update(){
  const d=flow(),kids=$('board').children;let wet=0,tot=0;
  d.forEach((v,i)=>{
    if(T[i].empty)return;
    tot++;if(v>=0)wet++;
    kids[i].classList.toggle('wet',v>=0);kids[i].style.setProperty('--d',v>0?v:0);
  });
  return {wet,done:wet===tot};
}

function build(restore){
  const [lo,hi]=RANGE[diff],span=hi-lo+1;
  n=lo+Math.min(span-1,Math.floor((level-1)/Math.ceil(TOTAL/span)));
  locked=false;$('msg').classList.remove('show');$('msgt').textContent='Every lotus is open.';$('next').textContent='Next level';
  rnd=mulberry(seedOf(diff+':'+level));
  const th=theme(level);applyTheme(th);
  const so=SHAPES[diff].filter(x=>MIN[x]<=n),sh=(so.length?so:['square'])[(rnd()*Math.max(so.length,1))|0];
  do{
    const g=gen(sh);T=g.m.map((m,i)=>({m,r:(rnd()*4)|0,empty:!g.seen[i]}));src=g.s;
  }while(flow().every((v,i)=>T[i].empty||v>=0));
  let par=0;T.forEach(t=>{if(t.empty)return;let k=0,m=rot(t.m,t.r);while(m!==t.m&&k<4){m=rot(m,1);k++}par+=k});
  limited=!!SLACK[diff];left=limited?Math.ceil(par*SLACK[diff][0])+SLACK[diff][1]:0;state='';
  if(restore&&restore.r&&restore.r.length===T.length){T.forEach((t,i)=>{t.r=restore.r[i]|0});if(limited)left=restore.left|0}
  showTurns();saveState();
  $('title').textContent='Level '+level;
  $('sub').textContent=(level===1&&diff==='easy')?'Turn the stones so the water reaches every lotus.':NAMES[sh]+' pond · '+th.name;
  const b=$('board');b.style.gridTemplateColumns='repeat('+n+',1fr)';b.innerHTML='';
  T.forEach((t,i)=>{
    if(t.empty){b.appendChild(document.createElement('div'));return}
    const bits=[0,1,2,3].filter(k=>t.m>>k&1),leaf=bits.length===1&&i!==src;
    let deco='';
    if(i===src)deco='<circle class="spring" cx="50" cy="50" r="19"/><circle class="ring" cx="50" cy="50" r="28"/>';
    else if(leaf)deco='<g class="lotus">'+[0,1,2,3,4,5,6,7].map(k=>'<ellipse cx="50" cy="33" rx="6.5" ry="14" transform="rotate('+k*45+' 50 50)"/>').join('')+'<circle class="heart" cx="50" cy="50" r="6"/></g>';
    else deco='<circle class="node" cx="50" cy="50" r="11"/>';
    const el=document.createElement('button');
    el.className='tile';el.setAttribute('aria-label','Stone '+(i+1)+', tap to turn');
    el.innerHTML='<svg viewBox="0 0 100 100"><rect class="bg" x="3" y="3" width="94" height="94" rx="14"/><g class="ch" fill="none" stroke-width="14">'+bits.map(k=>'<path d="'+ARMS[k]+'"/>').join('')+'</g>'+deco+'</svg>';
    el.firstChild.style.transform='rotate('+t.r*90+'deg)';
    el.onclick=()=>turn(i);
    b.appendChild(el);
  });
  update();
}

function saveState(){try{localStorage.setItem('lotus-state-'+diff,JSON.stringify({level,left,r:T.map(t=>t.r)}))}catch(e){}}
function clearState(){try{localStorage.removeItem('lotus-state-'+diff)}catch(e){}}
function loadState(){try{const o=JSON.parse(localStorage.getItem('lotus-state-'+diff)||'null');return o&&o.level>=1&&o.level<=TOTAL&&Array.isArray(o.r)?o:null}catch(e){return null}}
function start(){
  const sv=sound;sound=false;
  loadLevel();const st=loadState();if(st)level=st.level;
  build(st);
  const r=update();
  if(r.done)win();else if(limited&&left<=0)fail();
  sound=sv;
}

function turn(i){
  if(locked)return;
  T[i].r++;if(limited){left--;showTurns()}
  $('board').children[i].firstChild.style.transform='rotate('+T[i].r*90+'deg)';
  const s=update();saveState();
  drop();pluck(SCALE[s.wet%SCALE.length],.05,.1,1);
  if(s.done)win();else if(limited&&left<=0)fail();
}

function ac(){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function pluck(f,t0=0,g0=.09,dur=1.2){
  if(!sound)return;
  const c=ac(),t=c.currentTime+t0;
  [[1,1],[2,.28],[3.01,.1]].forEach(([m,a])=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type=m===1?'triangle':'sine';o.frequency.value=f*m;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(g0*a,t+.006);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur/m);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur/m+.05);
  });
}
function drop(){
  if(!sound)return;
  const c=ac(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.setValueAtTime(380,t);o.frequency.exponentialRampToValueAtTime(980,t+.09);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.16);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+.2);
}
function pad(f,t0,g0,dur){
  if(!sound)return;
  const c=ac(),t=c.currentTime+t0,o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(g0,t+.5);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05);
}
function success(){
  [523.3,587.3,659.3,784,880,1046.5,1174.7,1318.5,1568].forEach((f,j)=>pluck(f,.3+j*.11,.1,1.4));
  [2093,2349,2637].forEach((f,j)=>pluck(f,1.4+j*.14,.04,1.6));
  [523.3,659.3,784].forEach(f=>pad(f,1.2,.045,4.5));
}
function showTurns(){
  const t=$('turns');
  if(!limited){t.textContent='';t.classList.remove('low');return}
  t.textContent='Turns left: '+left;t.classList.toggle('low',left<=5);
}
function fail(){
  locked=true;state='fail';
  $('msgt').textContent='Out of turns. Take a breath and try again.';
  $('next').textContent='Try again';$('msg').classList.add('show');pluck(392,0,.08,1.4);pluck(330,.22,.07,1.6);
}
function win(){
  locked=true;$('msg').classList.add('show');
  if(level>=maxL){maxL=level+1;saveMax()}
  $('next').textContent=level>=TOTAL?'All levels':'Next level';state='win';clearState();
  success();
}

function openMenu(){
  $('lvh').textContent=diff[0].toUpperCase()+diff.slice(1)+' levels';
  const g=$('grid');g.innerHTML='';
  const unlocked=Math.min(maxL,TOTAL);
  for(let l=1;l<=TOTAL;l++){
    const t=theme(l),b=document.createElement('button');
    b.className='lvb'+(l===level?' cur':'')+(l<maxL?' done':'');
    b.textContent=l;b.disabled=l>unlocked;
    b.style.background='linear-gradient(135deg,'+t.bg1+','+t.bg2+')';
    b.style.color=t.wet;b.style.boxShadow='inset 0 0 0 2px '+t.wet+'88';
    b.setAttribute('aria-label','Level '+l+', '+t.name);
    b.onclick=()=>{level=l;closeMenu();build()};
    g.appendChild(b);
  }
  $('lv').classList.add('open');
}
function closeMenu(){$('lv').classList.remove('open')}

$('next').onclick=()=>{
  if(state==='fail'){build();return}
  if(level>=TOTAL){openMenu();return}
  level++;build();
};
$('bNew').onclick=build;
$('bLevels').onclick=openMenu;
$('lvc').onclick=closeMenu;
$('lv').onclick=e=>{if(e.target===$('lv'))closeMenu()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
$('bExit').onclick=()=>{
  if(!confirm('Leave the game? Your progress is saved.'))return;
  window.close();
  setTimeout(()=>{$('sub').textContent='You can now close the app with your phone Home or Back button.'},300);
};
$('bSound').onclick=()=>{sound=!sound;$('bSound').setAttribute('aria-pressed',sound)};
document.querySelectorAll('#diff .btn').forEach(b=>{b.onclick=()=>{diff=b.dataset.d;try{localStorage.setItem('lotus-diff',diff)}catch(e){}setDiff();start()}});
setDiff();start();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){})</script>
</body>
</html>
